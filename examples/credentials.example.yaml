# PowerHMC credentials file.
#
# Copy this file to ~/.ibmp/credentials and restrict its permissions:
#
#     mkdir -p ~/.ibmp
#     cp examples/credentials.example.yaml ~/.ibmp/credentials
#     chmod 0600 ~/.ibmp/credentials
#
# Select a profile with the `profile` provider argument or the POWERHMC_PROFILE
# environment variable (defaults to "default"). Point at a non-default location
# with the `credentials_file` argument or POWERHMC_CREDENTIALS_FILE.
#
# Credential resolution order (first complete match wins):
#   1. Provider configuration block (host/username/password)
#   2. Environment variables (POWERHMC_HOST/USERNAME/PASSWORD)
#   3. The selected profile below

profiles:
  default:
    host: hmc1.example.com
    username: hscroot
    password: changeme

  lab:
    host: hmc-lab.example.com
    username: admin
    password: changeme
    # TLS certificates are verified by default. Set insecure: true only for an
    # HMC with a self-signed certificate.
    insecure: true
